services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5108:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=speechy-db;Port=3306;Database=todolist;User=${DB_USER};Password=${DB_PASSWORD};"
      Jwt__Key: "${JWT_KEY}"
      Auth__DefaultUsername: "${ADMIN_USERNAME:-admin}"
      Auth__DefaultPassword: "${ADMIN_PASSWORD}"
      Frontend__Origin: "https://todo.spee-ai.com"
    networks:
      - default
      - speechy_default

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:80"

networks:
  speechy_default:
    external: true
